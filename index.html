<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">بازی تشخیص رنگ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --surface: rgba(255, 255, 255, 0.95);
            --surface-dark: rgba(0, 0, 0, 0.8);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-radius: 16px;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-medium: 0 20px 40px rgba(0, 0, 0, 0.15);
            --shadow-strong: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        @font-face {
          font-family: 'Vazir';
          src: url('Fonts/Vazir.woff2') format('woff2'),
               url('Fonts/Vazir.woff') format('woff');
        }
        
        body {
            font-family: Vazir;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .game-container {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-strong);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .game-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .game-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }
        
        .controls-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .control-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        select {
            background: white;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            min-width: 140px;
        }
        
        select:hover {
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .game-section {
            margin-bottom: 40px;
        }
        
        .section-header {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: var(--border-radius);
            border-left: 4px solid #667eea;
        }
        
        .color-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 16px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .color-box {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }
        
        .color-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .color-box:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: var(--shadow-medium);
        }
        
        .color-box:hover::before {
            opacity: 1;
        }
        
        .color-box.selected {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
            border: 3px solid #667eea;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 25px 50px rgba(102, 126, 234, 0.6); }
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 160px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-medium);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-strong);
        }
        
        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 2px solid rgba(102, 126, 234, 0.2);
            box-shadow: var(--shadow-soft);
        }
        
        .btn-secondary:hover {
            background: #f8fafc;
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .score-display {
            position: relative;
            text-align: center;
            padding: 32px;
            margin-top: 30px;
            border-radius: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        
        .score-display.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .score-perfect {
            background: linear-gradient(135deg, #ffd700, #ffed4e, #ffd700);
            background-size: 200% 200%;
            animation: goldShimmer 2s ease-in-out infinite;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.5),
                0 10px 40px rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
        }
        
        .score-good {
            background: linear-gradient(135deg, #10b981, #34d399, #10b981);
            background-size: 200% 200%;
            animation: greenPulse 2s ease-in-out infinite;
            box-shadow: 
                0 0 25px rgba(16, 185, 129, 0.4),
                0 10px 35px rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
        }
        
        .score-poor {
            background: linear-gradient(135deg, #ef4444, #f87171, #ef4444);
            background-size: 200% 200%;
            animation: redPulse 1.5s ease-in-out infinite;
            box-shadow: 
                0 0 20px rgba(239, 68, 68, 0.4),
                0 10px 30px rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
        }
        
        @keyframes goldShimmer {
            0%, 100% { 
                background-position: 0% 50%; 
                transform: scale(1);
            }
            50% { 
                background-position: 100% 50%; 
                transform: scale(1.02);
            }
        }
        
        @keyframes greenPulse {
            0%, 100% { 
                background-position: 0% 50%; 
                box-shadow: 
                    0 0 25px rgba(16, 185, 129, 0.4),
                    0 10px 35px rgba(16, 185, 129, 0.2);
            }
            50% { 
                background-position: 100% 50%; 
                box-shadow: 
                    0 0 35px rgba(16, 185, 129, 0.6),
                    0 15px 45px rgba(16, 185, 129, 0.3);
            }
        }
        
        @keyframes redPulse {
            0%, 100% { 
                background-position: 0% 50%; 
                opacity: 0.9;
            }
            50% { 
                background-position: 100% 50%; 
                opacity: 1;
            }
        }
        
        .score-content {
            position: relative;
            z-index: 2;
        }
        
        .score-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 12px;
            animation: bounceIn 0.8s ease-out 0.5s both;
        }
        
        .score-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: slideInUp 0.6s ease-out 0.7s both;
        }
        
        .score-value {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
            animation: scaleIn 0.8s ease-out 0.9s both;
        }
        
        .score-message {
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            margin-top: 8px;
            animation: fadeInUp 0.6s ease-out 1.1s both;
        }
        
        @keyframes bounceIn {
            0% { 
                opacity: 0; 
                transform: scale(0.3) rotate(-180deg); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1.1) rotate(-10deg); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg); 
            }
        }
        
        @keyframes slideInUp {
            0% { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes scaleIn {
            0% { 
                opacity: 0; 
                transform: scale(0.5); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }
        
        @keyframes fadeInUp {
            0% { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        .confetti {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: confettiFall 3s linear infinite;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .hidden {
            display: none;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .game-container {
                padding: 24px;
                margin: 10px;
            }
            
            .game-title {
                font-size: 2rem;
            }
            
            .controls-section {
                gap: 20px;
            }
            
            .color-panel {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 12px;
            }
            
            .color-box {
                width: 60px;
                height: 60px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                min-width: 200px;
            }
        }
        
        @media (max-width: 480px) {
            .game-container {
                padding: 20px;
            }
            
            .game-title {
                font-size: 1.8rem;
            }
            
            .section-header {
                font-size: 1.1rem;
                padding: 12px 16px;
            }
            
            .color-box {
                width: 50px;
                height: 50px;
            }
        }
        
        /* Loading Animation */
        .loading {
            position: relative;
            overflow: hidden;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>

    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">بینایی رنگ</h1>
            <p class="game-subtitle">مهارت تشخیص رنگ خود را آزمایش کنید</p>
        </div>

        <div class="controls-section">
            <div class="control-group">
                <label for="language" class="control-label">زبان</label>
                <select id="language" onchange="changeLanguage()">
                    <option value="fa">فارسی</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="control-group">
                <label for="difficulty" class="control-label" id="difficultyLabel">انتخاب سطح دشواری</label>
                <select id="difficulty" onchange="resetGame()">
                    <option value="1">سطح ۱</option>
                    <option value="2">سطح ۲</option>
                    <option value="3">سطح ۳</option>
                    <option value="4">سطح ۴</option>
                    <option value="5">سطح ۵</option>
                </select>
            </div>
        </div>

        <div class="game-section">
            <div class="section-header" id="originalColorsHeader">به این رنگ‌ها نگاه کنید</div>
            <div id="colorPanel" class="color-panel"></div>
        </div>

        <div class="game-section">
            <div class="section-header" id="testColorsHeader">دو تا از این رنگ‌ها، در رنگ‌های بالا نیستند. آنها را انتخاب کنید</div>
            <div id="testPanel" class="color-panel"></div>
        </div>

        <div class="action-buttons">
            <button id="calculateScoreButton" class="btn btn-primary">محاسبه امتیاز</button>
            <button id="resetButton" class="btn btn-secondary">بازی مجدد</button>
        </div>

        <div id="score" class="score-display"></div>
    </div>

    <script>
        const colorPanel = document.getElementById('colorPanel');
        const testPanel = document.getElementById('testPanel');
        const calculateScoreButton = document.getElementById('calculateScoreButton');
        const resetButton = document.getElementById('resetButton');
        const scoreDiv = document.getElementById('score');

        const translations = {
            en: {
                pageTitle: "Color Recognition Game",
                gameTitle: "Color Vision",
                gameSubtitle: "Test your color perception skills",
                languageLabel: "Language",
                originalColorsHeader: "Look at these colors",
                testColorsHeader: "Choose 2 of these colors that are not in the above colors",
                calculateScoreButton: "Calculate Score",
                resetButton: "Reset Game",
                scoreText: "Your Score",
                selectColorsAlert: "Please select exactly 2 colors.",
                difficultyLabel: "Difficulty",
                difficultyLevels: ["Level 1", "Level 2", "Level 3", "Level 4", "Level 5"],
                scoreMessages: {
                    perfect: "Perfect! Amazing color vision!",
                    good: "Great job! You have good color perception!",
                    poor: "Keep practicing! Your color vision will improve!"
                }
            },
            fa: {
                pageTitle: "بازی تشخیص رنگ",
                gameTitle: "بینایی رنگ",
                gameSubtitle: "مهارت تشخیص رنگ خود را آزمایش کنید",
                languageLabel: "زبان",
                originalColorsHeader: "به این رنگ‌ها نگاه کنید",
                testColorsHeader: "دو تا از این رنگ‌ها، در رنگ‌های بالا نیستند. آنها را انتخاب کنید",
                calculateScoreButton: "محاسبه امتیاز",
                resetButton: "بازی مجدد",
                scoreText: "امتیاز شما",
                selectColorsAlert: "لطفاً دقیقاً ۲ رنگ انتخاب کنید.",
                difficultyLabel: "سطح دشواری",
                difficultyLevels: ["سطح ۱", "سطح ۲", "سطح ۳", "سطح ۴", "سطح ۵"],
                scoreMessages: {
                    perfect: "عالی! بینایی رنگ فوق‌العاده‌ای دارید!",
                    good: "آفرین! تشخیص رنگ خوبی دارید!",
                    poor: "ادامه بدهید! بینایی رنگ شما بهتر خواهد شد!"
                }
            }
        };

        function changeLanguage() {
            const language = document.getElementById('language').value;
            const t = translations[language];
            
            // Update page title
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.title = t.pageTitle;
            
            // Update all UI elements
            document.querySelector('.game-title').textContent = t.gameTitle;
            document.querySelector('.game-subtitle').textContent = t.gameSubtitle;
            document.querySelector('.control-label').textContent = t.languageLabel;
            document.getElementById('originalColorsHeader').textContent = t.originalColorsHeader;
            document.getElementById('testColorsHeader').textContent = t.testColorsHeader;
            document.getElementById('calculateScoreButton').textContent = t.calculateScoreButton;
            document.getElementById('resetButton').textContent = t.resetButton;
            document.getElementById('difficultyLabel').textContent = t.difficultyLabel;
            
            // Update difficulty options
            const difficultySelect = document.getElementById('difficulty');
            const options = difficultySelect.options;
            for (let i = 0; i < options.length; i++) {
                options[i].text = t.difficultyLevels[i];
            }
            
            // Update score if it exists
            if (score !== undefined && scoreDiv.classList.contains('show')) {
                updateScoreDisplay(score, language);
            }
        }

        let colors = [];
        let testColors = [];
        let selectedColors = [];
        let score = 0;

        function generateColors() {
            colors = [];
            const baseRed = Math.floor(Math.random() * 256);
            const baseGreen = Math.floor(Math.random() * 256);
            const baseBlue = Math.floor(Math.random() * 256);
            const channel = Math.floor(Math.random() * 3); // Randomly choose a channel: 0 for red, 1 for green, 2 for blue
            const difficulty = parseInt(document.getElementById('difficulty').value);
            const increment = [20, 15, 10, 5, 1][difficulty - 1];
            const maxStartValue = 255 - (increment * 11);
            const startValue = Math.floor(Math.random() * maxStartValue);

            for (let i = 0; i < 12; i++) {
                let color;
                if (channel === 0) {
                    color = `rgb(${startValue + i * increment}, ${baseGreen}, ${baseBlue})`;
                } else if (channel === 1) {
                    color = `rgb(${baseRed}, ${startValue + i * increment}, ${baseBlue})`;
                } else {
                    color = `rgb(${baseRed}, ${baseGreen}, ${startValue + i * increment})`;
                }
                colors.push(color);
            }
        }

        function displayColors(panel, colorArray, isTestPanel = false) {
            panel.innerHTML = '';
            colorArray.forEach((color, index) => {
                const div = document.createElement('div');
                div.className = 'color-box';
                div.style.backgroundColor = color;
                if (isTestPanel) {
                    div.addEventListener('click', () => selectColor(div, color));
                }
                
                // Add staggered animation
                setTimeout(() => {
                    div.style.opacity = '1';
                    div.style.transform = 'translateY(0)';
                }, index * 50);
                
                div.style.opacity = '0';
                div.style.transform = 'translateY(20px)';
                div.style.transition = 'all 0.5s ease';
                
                panel.appendChild(div);
            });
        }

        function generateTestColors() {
            const selectedColors = colors.slice(0, 10);
            const newColors = colors.slice(10, 12);
            const randomSelectedColors = selectedColors.sort(() => Math.random() - 0.5).slice(0, 3);
            testColors = [...randomSelectedColors, ...newColors].sort(() => Math.random() - 0.5);
        }

        function selectColor(div, color) {
            if (selectedColors.includes(color)) {
                selectedColors = selectedColors.filter(c => c !== color);
                div.classList.remove('selected');
            } else if (selectedColors.length < 2) {
                selectedColors.push(color);
                div.classList.add('selected');
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7'];
            
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + '%';
                piece.style.animationDelay = Math.random() * 3 + 's';
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.appendChild(piece);
            }
            
            return confetti;
        }
        
        function updateScoreDisplay(userScore, language = null) {
            const lang = language || document.getElementById('language').value;
            const t = translations[lang];
            
            // Remove existing classes and confetti
            scoreDiv.className = 'score-display show';
            scoreDiv.innerHTML = '';
            
            let emoji, scoreClass, message;
            
            if (userScore === 2) {
                emoji = '🏆';
                scoreClass = 'score-perfect';
                message = t.scoreMessages.perfect;
                
                // Add confetti for perfect score
                const confetti = createConfetti();
                scoreDiv.appendChild(confetti);
            } else if (userScore === 1) {
                emoji = '👍';
                scoreClass = 'score-good';
                message = t.scoreMessages.good;
            } else {
                emoji = '💪';
                scoreClass = 'score-poor';
                message = t.scoreMessages.poor;
            }
            
            scoreDiv.classList.add(scoreClass);
            
            const scoreContent = document.createElement('div');
            scoreContent.className = 'score-content';
            scoreContent.innerHTML = `
                <span class="score-emoji">${emoji}</span>
                <div class="score-text">${t.scoreText}</div>
                <div class="score-value">${userScore}/2</div>
                <div class="score-message">${message}</div>
            `;
            
            scoreDiv.appendChild(scoreContent);
        }
        
        function calculateScore() {
            if (selectedColors.length !== 2) {
                alert(translations[document.getElementById('language').value].selectColorsAlert);
                return;
            }
            let userScore = 0;
            selectedColors.forEach(color => {
                if (colors.slice(10, 12).includes(color)) {
                    userScore++;
                }
            });
            score = userScore;
            
            updateScoreDisplay(userScore);

            const difficulty = document.getElementById('difficulty').value;

            dataLayer.push({
                'event': 'score_calculated',
                'score': score,
                'difficulty': difficulty
            });
            gtag('event', 'score_calculated', {
               'score': score,
               'difficulty': difficulty
             });
        }

        calculateScoreButton.addEventListener('click', calculateScore);

        resetButton.addEventListener('click', resetGame);

        function resetGame() {
            scoreDiv.textContent = '';
            scoreDiv.classList.remove('show');
            generateColors();
            displayColors(colorPanel, colors.slice(0, 10));
            generateTestColors();
            displayColors(testPanel, testColors, true);
            selectedColors = [];
        }

        // Initialize the game
        resetGame();
    </script>
</body>
</html>
